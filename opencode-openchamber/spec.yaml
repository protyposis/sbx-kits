schemaVersion: "2"
kind: sandbox
name: opencode-openchamber
displayName: OpenChamber for OpenCode
version: "4"

sandbox:
  image: "docker/sandbox-templates:opencode-docker"
  entrypoint: ["bash", "/home/agent/bin/start-opencode-openchamber"]

agentInstructions:
  filename: AGENTS.md
  content: |
    This sandbox serves the OpenChamber open-source AI workspace built upon OpenCode.

    Runtime ports:
    - OpenCode TUI/server: http://127.0.0.1:4096
    - OpenChamber web UI: http://127.0.0.1:3000, LAN-bound by OpenChamber via --lan

environment:
  variables:
    IS_SANDBOX: "1"
    OPENCODE_HOSTNAME: "127.0.0.1"
    OPENCODE_PORT: "4096"
    OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS: true
    OPENCHAMBER_PORT: "3000"
    OPENCHAMBER_OPENCODE_HOSTNAME: "127.0.0.1"
    OPENCHAMBER_OPENCODE_PORT: "4096"
    OPENCHAMBER_ALLOW_UNAUTHENTICATED_LAN: true

ports:
  - container: 3000
    protocol: tcp
    name: openchamber

setup:
  install:
    - command: |
        set -eu
        if command -v apt-get >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates unzip jq bash git procps
        fi
      description: Install requirements
    - command: |
        set -eu
        # Official sandbox image still ships v1 at time of writing
        if npm ls -g --depth=0 opencode-ai >/dev/null 2>&1; then
          npm uninstall -g opencode-ai
        fi
      user: "1000"
      description: Remove OpenCode v1 if present
    - command: |
        set -euo pipefail
        npm install -g @opencode/cli
      user: "1000"
      description: Install OpenCode v2
    - command: |
        set -eu
        npm install -g @openchamber/web
      user: "1000"
      description: Install OpenChamber
    - command: |
        set -eu
        mkdir -p /home/agent/.local/bin
        ln -sf "$(npm prefix -g)/bin/openchamber" /home/agent/.local/bin/openchamber
      user: "1000"
      description: Symlink OpenChamber binary to a directory on PATH
