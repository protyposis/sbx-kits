schemaVersion: "2"
kind: mixin
name: apm
version: "1"
displayName: Agent Package Manager
description: >
  Installs the Microsoft Agent Package Manager (apm) CLI. APM manages AI agent
  context dependencies — skills, prompts, instructions, plugins, and MCP servers —
  declared in an apm.yml file.

permissions:
  network:
    allow:
      - aka.ms
      - github.com
      - api.github.com
      - pypi.org
      - files.pythonhosted.org

setup:
  install:
    - command: |
        set -eu
        curl -sSL https://aka.ms/apm-unix | APM_INSTALL_DIR=/home/agent/.local/bin sh
      user: "1000"
      description: Install APM CLI

agentInstructions:
  content: |
    APM (Agent Package Manager) is installed. Use `apm` to manage agent context
    dependencies declared in `apm.yml`.

    Common commands:
    - `apm init <name>` — create a new APM project
    - `apm install` — install dependencies from apm.yml
    - `apm run` — run a prompt
