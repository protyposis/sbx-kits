schemaVersion: "2"
kind: mixin
name: traffic-inspection-ca
version: "1"
displayName: Traffic Inspection CA
description: >
  Installs a corporate CA certificate so TLS traffic works behind an
  intercepting proxy (e.g., ZScaler).

environment:
  variables:
    INSPECTION_CA_CERT_PATH: ""
    # Path inside the sandbox to a PEM-encoded CA certificate.
    # If empty (the default), the kit looks for inspection-ca.pem at the workspace
    # root, then falls back to auto-detection via INSPECTION_DETECT_URL.
    INSPECTION_DETECT_URL: "https://example.com"
    # HTTPS URL probed to detect TLS interception when no certificate file
    # is provided. Change this if the default URL is unreachable.

commands:
  install:
    - command: |
        set -eu
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y -qq ca-certificates openssl curl
        elif command -v apk >/dev/null 2>&1; then
          apk add --no-cache ca-certificates openssl curl
        fi
      description: Ensure ca-certificates, openssl, and curl are installed

  initFiles:
    - path: /home/agent/.traffic-inspection-ca/default-cert-path
      content: "${WORKDIR}/inspection-ca.pem"
      description: Resolve the workspace-relative default certificate path

  startup:
    - command: ["bash", "/home/agent/bin/install-traffic-inspection-ca"]
      user: "0"
      description: Install corporate CA certificate into the system trust store

memory: |
  The traffic-inspection-ca mixin is loaded. It installs a corporate CA certificate
  to make TLS work behind an intercepting proxy such as ZScaler.
