schemaVersion: "2"
kind: mixin
name: opencode-omo
version: "1"

environment:
  variables:
    OMO_DISABLE_POSTHOG: "1"
    OMO_SEND_ANONYMOUS_TELEMETRY: "0"

commands:
  install:
    - command: |
        set -eu
        if ! command -v bun >/dev/null 2>&1; then
          if command -v npm >/dev/null 2>&1; then
            npm install -g bun
          else
            curl -fsSL https://bun.sh/install | bash
          fi
        fi
      user: "1000"
      description: Install Bun for bunx-based Oh My OpenAgent installer
    - command: |
        set -eu
        mkdir -p "$HOME/.local/bin"
        if [ -x "$HOME/.bun/bin/bun" ]; then
          bun_bin="$HOME/.bun/bin/bun"
          bunx_bin="$HOME/.bun/bin/bunx"
        elif command -v bun >/dev/null 2>&1; then
          bun_bin=$(command -v bun)
          bunx_bin="${bun_bin%/*}/bunx"
        else
          echo "opencode-omo: bun not found after install" >&2
          exit 1
        fi
        ln -sf "$bun_bin" "$HOME/.local/bin/bun"
        ln -sf "$bunx_bin" "$HOME/.local/bin/bunx"
      user: "1000"
      description: Symlink bun and bunx to a directory on PATH
    - command: |
        set -eu
        bunx oh-my-openagent install \
          --no-tui \
          --platform=opencode \
          --claude=no \
          --openai=yes \
          --gemini=no \
          --copilot=no \
          --opencode-zen=no \
          --zai-coding-plan=no \
          --opencode-go=yes \
          --kimi-for-coding=no \
          --vercel-ai-gateway=no \
          --skip-auth
      user: "1000"
      description: Install Oh My OpenAgent for OpenCode with OpenAI and OpenCode Go enabled

memory: |
  Oh My OpenAgent is installed and configured for OpenCode with OpenAI/ChatGPT and OpenCode Go providers enabled.
