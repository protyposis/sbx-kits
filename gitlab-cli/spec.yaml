schemaVersion: "2"
kind: mixin
name: gitlab-cli
version: "1"
displayName: GitLab CLI
description: >
  Provides the GitLab CLI (`glab` command) with envar-based token auth (GITLAB_TOKEN
  and optionally GITLAB_HOST). Use the exit code of `glab api user >/dev/null` to
  check if the CLI is authenticated (`glab auth status` does not work with env tokens).
  Use `glab` for MRs, reviews, pipelines, and other GitLab operations.

commands:
  install:
    - command: |
        set -eu
        if ! command -v brew >/dev/null 2>&1; then
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> "$HOME/.profile"
        fi
      user: "1000"
      description: Install Homebrew (if absent)
    - command: |
        set -eu
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install glab
      user: "1000"
      description: Install GitLab CLI
    - command: |
        set -eu
        touch /etc/sandbox-persistent.sh
        grep -q '/home/linuxbrew/.linuxbrew/bin/brew shellenv' /etc/sandbox-persistent.sh 2>/dev/null \
          || printf 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"\n' >> /etc/sandbox-persistent.sh
      description: Add Homebrew (and glab) to PATH via /etc/sandbox-persistent.sh

  startup:
    - command:
        - sh
        - -c
        - |
          set -eu

          # Respect manual override already present in sandbox-persistent.sh
          if grep -q 'GITLAB_HOST' /etc/sandbox-persistent.sh 2>/dev/null; then
            exit 0
          fi

          # Get workspace path written at init time
          workdir=$(cat /home/agent/.config/gitlab-cli/workdir 2>/dev/null || true)
          [ -z "$workdir" ] && exit 0

          # Require git
          command -v git >/dev/null 2>&1 || exit 0

          # Require a git repository at the workspace root
          git -C "$workdir" rev-parse --git-dir >/dev/null 2>&1 || exit 0

          # Require an origin remote
          origin_url=$(git -C "$workdir" remote get-url origin 2>/dev/null || true)
          [ -z "$origin_url" ] && exit 0

          # Extract the hostname from the URL
          # Handles: git@host:path  https://[user@]host[:port]/path  ssh://[user@]host[:port]/path
          host=""
          case "$origin_url" in
            git@*:*)
              host=$(printf '%s\n' "$origin_url" | sed 's/^git@//; s/:.*//')
              ;;
            *://*)
              host=$(printf '%s\n' "$origin_url" | sed 's|^[^/]*://||; s|^[^@]*@||; s|[/:?#].*||')
              ;;
          esac

          # Skip if it resolves to the default
          [ "$host" = "gitlab.com" ] && exit 0

          # Write the detected host so glab picks it up from the environment
          printf "export GITLAB_HOST='%s'\n" "$host" >> /etc/sandbox-persistent.sh
          echo "gitlab-cli: GITLAB_HOST set to $host (detected from git origin)" >&2
      description: Auto-detect GitLab host from workspace git origin

  initFiles:
    - path: /home/agent/.config/gitlab-cli/workdir
      content: "${WORKDIR}"

memory: |
  GitLab CLI (`glab` command) is installed via Homebrew (`brew` command).
  Use `glab` for all GitLab operations, e.g. cloning, MRs, reviews, pipelines.
  
  The sandbox proxy handles GitLab authentication automatically by injecting credentials for CLI and HTTPS
  Git operations. You do not need to run `glab auth login` or configure Git credentials inside the
  sandbox — the proxy takes care of it transparently.
  Important: `glab auth status` will show "not logged in" inside the sandbox. This is expected and
  does not mean Git operations will fail. The proxy injects credentials at the network level,
  independently of the `glab` CLI auth state.

  `glab` also requires the GITLAB_HOST environment variable to determine which GitLab
  instance to target. The host is auto-detected from the workspace git origin URL (if it's a Git repo),
  and written to /etc/sandbox-persistent.sh so it persists across restarts. To override, append
  `export GITLAB_HOST='<host>'` to /etc/sandbox-persistent.sh before starting the sandbox (or via
  `sbx exec`) — the kit respects any GITLAB_HOST already present and skips auto-detection.
