schemaVersion: "2"
kind: mixin
name: gitlab-cli
version: "1"

commands:
  install:
    - command: |
        set -eu
        if ! command -v brew >/dev/null 2>&1; then
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> "$HOME/.profile"
        fi
      user: "1000"
      description: Install Homebrew (if absent)
    - command: |
        set -eu
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install glab
      user: "1000"
      description: Install GitLab CLI

  startup:
    - command:
        - sh
        - -c
        - |
          set -eu

          # Respect manual override in gitlab-host.sh
          if grep -q 'GITLAB_HOST' /home/agent/.config/gitlab-cli/gitlab-host.sh 2>/dev/null; then
            exit 0
          fi

          # Get workspace path written at init time
          workdir=$(cat /home/agent/.config/gitlab-cli/workdir 2>/dev/null || true)
          [ -z "$workdir" ] && exit 0

          # Require git
          command -v git >/dev/null 2>&1 || exit 0

          # Require a git repository at the workspace root
          git -C "$workdir" rev-parse --git-dir >/dev/null 2>&1 || exit 0

          # Require an origin remote
          origin_url=$(git -C "$workdir" remote get-url origin 2>/dev/null || true)
          [ -z "$origin_url" ] && exit 0

          # Extract the hostname from the URL
          # Handles: git@host:path  https://[user@]host[:port]/path  ssh://[user@]host[:port]/path
          host=""
          case "$origin_url" in
            git@*:*)
              host=$(printf '%s\n' "$origin_url" | sed 's/^git@//; s/:.*//')
              ;;
            *://*)
              host=$(printf '%s\n' "$origin_url" | sed 's|^[^/]*://||; s|^[^@]*@||; s|[/:?#].*||')
              ;;
          esac

          # Skip if it resolves to the default
          [ "$host" = "gitlab.com" ] && exit 0

          # Write the detected host for the glab shim
          printf "export GITLAB_HOST='%s'\n" "$host" > /home/agent/.config/gitlab-cli/gitlab-host.sh
          echo "gitlab-cli: GITLAB_HOST set to $host (detected from git origin)" >&2
      user: "1000"
      description: Auto-detect GitLab host from workspace git origin

  initFiles:
    - path: /home/agent/.config/gitlab-cli/workdir
      content: "${WORKDIR}"
    - path: /home/agent/.local/bin/glab
      mode: "0755"
      content: |
        #!/bin/sh
        if [ -z "$GITLAB_HOST" ] && [ -f "/home/agent/.config/gitlab-cli/gitlab-host.sh" ]; then
          . /home/agent/.config/gitlab-cli/gitlab-host.sh
        fi
        exec /home/linuxbrew/.linuxbrew/bin/glab "$@"

memory: |
  GitLab CLI (glab) is installed via Homebrew. A shim at ~/.local/bin/glab
  sources the detected host before delegating to the real binary.
  GITLAB_HOST sets the default GitLab instance host. When the workspace is a Git
  repository with a self-managed GitLab origin, GITLAB_HOST is auto-detected on
  each sandbox start and written to ~/.config/gitlab-cli/gitlab-host.sh.
  To manually set the host, write `export GITLAB_HOST='<host>'` to
  ~/.config/gitlab-cli/gitlab-host.sh.
  GITLAB_TOKEN is injected via a custom secret (sbx secret set-custom). The sandbox
  sees a placeholder which gets replaced by a proxy on the host.

  Use this CLI to manage GitLab resources from the command line, e.g. cloning, MRs, reviews, pipelines.
