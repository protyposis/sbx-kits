schemaVersion: "2"
kind: mixin
name: opencode-go-auth
version: "1"

network:
  serviceDomains:
    opencode.ai: opencode-go
  serviceAuth:
    opencode-go:
      headerName: Authorization
      valueFormat: "Bearer %s"

credentials:
  sources:
    opencode-go:
      env:
        - OPENCODE_GO_API_KEY

environment:
  proxyManaged:
    - OPENCODE_GO_API_KEY

commands:
  startup:
    - command:
        - sh
        - -c
        - |
          set -eu
          key="${OPENCODE_GO_API_KEY:-}"
          if [ -z "$key" ]; then
            exit 0
          fi
          auth_file="$HOME/.local/share/opencode/auth.json"
          mkdir -p "$(dirname "$auth_file")"
          if [ -f "$auth_file" ] && command -v jq >/dev/null 2>&1; then
            tmp=$(jq --arg k "$key" '.["opencode-go"] = {"type": "api", "key": $k}' "$auth_file") && \
              printf '%s\n' "$tmp" > "$auth_file"
          else
            printf '{"opencode-go":{"type":"api","key":"%s"}}\n' "$key" > "$auth_file"
          fi
          echo "OpenCode Go credential written to $auth_file (proxy-managed)" >&2
      user: "1000"
      description: Inject proxy-managed OpenCode Go API key into OpenCode auth.json

memory: |
  OpenCode Go authentication is proxy-managed: the sandbox network proxy intercepts
  outbound requests to opencode.ai and replaces the Authorization header with the
  real credential before forwarding. OPENCODE_GO_API_KEY is sourced via the proxy.
